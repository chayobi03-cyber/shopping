name: Shopping Quality Gates

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate JSON schema syntax
        run: python -c "import json, pathlib; [json.loads(p.read_text()) for p in pathlib.Path('schemas').glob('*.schema.json')]"
      - name: Run unit and contract tests
        run: python -m pytest -q
