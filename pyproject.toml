[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-intelligence"
version = "0.2.0"
description = "Evidence-first shopping research and deterministic decision gates"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.22"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
