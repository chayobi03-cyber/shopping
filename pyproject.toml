[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-intelligence"
version = "0.3.0"
description = "Evidence-first shopping research and deterministic decision gates"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.22"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
